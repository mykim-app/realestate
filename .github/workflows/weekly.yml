name: 주간 가격 기록

on:
  schedule:
    # 한국부동산원 주간 동향은 매주 목요일 공표 -> 금요일 오전 7시(한국시간)에 기록
    - cron: "0 22 * * 4"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장된 모든 관심 위치 주간 기록 갱신
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          curl -fsS -X POST \
            -H "x-cron-key: ${CRON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://vewmmndhipvazzmttzzr.supabase.co/functions/v1/realestate?op=refresh"
